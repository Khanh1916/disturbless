[package]
name = "disturbless"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/Khanh1916/disturbless"
authors = ["Khanh1916"]
readme = "../README.md"
description = "Disturbless: a focus lock you cannot quit until the time is up"
build = "build.rs"

[dependencies]
disturbless-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.18"
fastrand = "2"
base64 = "0.23"
winreg = "0.56"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
tauri-build = "2"

[lints.clippy]
all = { level = "warn", priority = -1 }
